name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar y probar
        run: ./mvnw -B verify
      # Arranca el JAR real, elige "0. Salir" y exige el mensaje de despedida.
      - name: Arrancar la consola
        run: echo 0 | timeout 60 java -jar target/unireserva-*.jar | tee consola.log && grep -q "Hasta luego" consola.log
        shell: bash
