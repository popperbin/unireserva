spring.application.name=unireserva

# Lee el .env local (si existe) para que la app y Docker Compose usen los mismos valores.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:unireserva}
spring.datasource.username=${POSTGRES_USER:unireserva}
# Sin valor por defecto: ninguna contrasena se guarda en el repositorio.
spring.datasource.password=${POSTGRES_PASSWORD}

spring.flyway.locations=classpath:db/migration

# Aplicacion de consola: sin servidor web.
spring.main.web-application-type=none
# La consola es la interfaz de usuario: solo se muestran avisos y errores.
spring.main.banner-mode=off
logging.level.root=warn
